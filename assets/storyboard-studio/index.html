<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storyboard Studio</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="toolbar unified-toolbar">
 <button id="library-toggle" aria-expanded="true" title="Show or hide reference library">Library</button>
 <h1><span class="studio-brand">Storyboard Studio</span><span id="project-title" class="sr-only">Cinematic project</span></h1>
 <div id="board-controls" class="board-controls" aria-label="Storyboards"><label class="sr-only" for="board-select">Storyboard</label><select id="board-select" disabled><option>Loading storyboard…</option></select><button id="board-id" class="board-id-copy" aria-label="Copy storyboard ID" disabled></button><button id="rename-board-inline" aria-label="Rename storyboard" title="Rename storyboard" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4 5 5-11 11H4v-5ZM13 6l5 5"/></svg></button><span id="board-store-note" hidden>Board controls pending server update</span></div>
 <span id="save-state" role="status" aria-live="polite">Loading…</span>
 <div class="toolbar-history"><button id="undo" aria-label="Undo" title="Undo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 3 10l5 5M3 10h10a7 7 0 0 1 7 7"/></svg></button><button id="redo" aria-label="Redo" title="Redo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 5 5 5-5 5M21 10H11a7 7 0 0 0-7 7"/></svg></button></div>
 <button id="new-scene" class="toolbar-create">New scene</button>
 <div class="toolbar-view"><span id="duration-total" title="Selected duration / film target"></span><button id="issues-badge" hidden>Issues</button><div class="zoom-controls"><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-reset" aria-label="Reset zoom">100%</button><button id="zoom-in" aria-label="Zoom in">+</button></div><button id="fit">Fit</button></div>
 <details class="toolbar-menu"><summary aria-label="More storyboard actions" title="More actions"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></summary><div class="toolbar-menu-panel">
  <p id="menu-save-state" class="toolbar-menu-state">Loading…</p>
  <div class="toolbar-menu-section compact-canvas-actions"><span class="toolbar-menu-caption">Canvas</span><button data-toolbar-proxy="fit">Fit all cards</button><button data-toolbar-proxy="zoom-out">Zoom out</button><button data-toolbar-proxy="zoom-in">Zoom in</button><button data-toolbar-proxy="redo">Redo</button></div>
  <div class="toolbar-menu-section"><span class="toolbar-menu-caption">Storyboard</span><button id="new-board" disabled>New storyboard</button><button id="duplicate-board" disabled>Duplicate storyboard</button><button id="rename-board" disabled>Rename storyboard</button><button id="rename-project">Rename project</button><button id="revisions">Revisions</button><button id="requests">Saved requests</button></div>
  <div class="toolbar-menu-section"><span class="toolbar-menu-caption">Scenes</span><button id="add-start" hidden>Add Start card</button><button id="add-end" hidden>Add End card</button><button id="duplicate-selected" title="Duplicate selected scenes">Duplicate selected scenes</button><button id="delete-selected">Delete selected scenes</button></div>
  <div class="toolbar-menu-section"><span class="toolbar-menu-caption">View</span><button id="review-toggle" aria-pressed="false">Review frames</button><label for="navigation-input">Navigation</label><select id="navigation-input" aria-label="Navigation input"><option value="auto">Auto input</option><option value="mouse">Mouse zoom</option><option value="trackpad">Trackpad pan</option></select></div>
  <div class="toolbar-menu-section"><span class="toolbar-menu-caption">Files</span><button id="media-import">Import media</button><button id="import">Import board</button><button id="export">Board JSON</button><button id="plan-export">Download brief</button><button id="request-storyboard" hidden>Request storyboard</button></div>
 </div></details>
</header>
<main id="workspace">
 <aside id="library" aria-label="Reference library"><div id="tray-resize" tabindex="0" role="separator" aria-label="Resize media tray" aria-orientation="horizontal" aria-valuemin="120" aria-valuemax="600" aria-valuenow="230"></div><div class="panel-head"><h2>Reference library</h2><span id="reference-count"></span></div><p class="muted tray-help">Drag a view onto the canvas, or select Add scene.</p><div class="tray-controls"><input id="search" type="search" placeholder="Search scenes and notes" aria-label="Search references"><div class="filters"><select id="version" aria-label="Filter version"><option value="">All versions</option></select><select id="orientation" aria-label="Filter orientation"><option value="">All formats</option><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option></select><select id="status-filter" aria-label="Filter source status"><option value="">All statuses</option></select><select id="tag-filter" aria-label="Filter action tags"><option value="">All action tags</option></select><select id="media-filter" aria-label="Filter media type"><option value="">Clips and stills</option><option value="clip">Clips</option><option value="still">Stills</option></select><button id="clear-filters">Clear filters</button></div><label class="density-label" for="thumbnail-size">Thumbnail size<input id="thumbnail-size" type="range" min="80" max="240" value="150" step="10"></label></div><div id="reference-list"></div></aside>
 <section class="editor" aria-label="Storyboard editor"><div id="viewport" tabindex="0" aria-label="Node canvas. Mouse wheel zooms; two-finger trackpad scroll pans; pinch or Control scroll zooms. Space plus drag also pans. Drag scenes to move them. Use Alt plus Left or Right Arrow to reorder selected scenes. Enter edits a scene title; duration is editable on its card. Shift or Command click selects multiple scenes; Space selects a focused card and Shift+Space toggles its membership; drag background to select."><div id="world"><svg id="connections" aria-label="Scene connections"></svg><div id="nodes"></div><div id="effects"></div></div><div id="empty-canvas">Add a reference frame to begin your storyboard.</div><div id="connection-hint" hidden></div><aside id="inspector" class="floating-selection" aria-label="Scene feedback" hidden><div id="popover-header" title="S: split view; Alt + Left/Right: reorder; Command + D: duplicate"><h2 id="popover-title">Scene</h2><button id="popover-close" aria-label="Close scene feedback">×</button></div><div id="inspector-content"></div></aside></div><div id="issue-toast" role="status" aria-live="polite" hidden><button id="dismiss-issues" aria-label="Dismiss issues">×</button><div id="validation"></div></div></section>

</main>
<input id="media-file" type="file" accept="image/*,video/*" hidden>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<dialog id="detail" aria-label="Storyboard details"><button id="detail-close" aria-label="Close reference preview">Close</button><div id="detail-content"></div></dialog>
<script src="app.js"></script>
</body></html>
